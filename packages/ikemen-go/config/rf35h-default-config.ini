; devaOS RF35H: valori iniziali di IKEMEN GO per la console (640x480, Mali-G31).
; rf35h-ikemen copia questo file in /storage/roms/ikemen/save/config.ini solo se
; non esiste; IKEMEN lo completa con tutte le altre chiavi al primo salvataggio.
; Il renderer si cambia dalle opzioni del core IKEMEN GO in RetroArch (Core
; senza contenuto, Menu rapido) o dal menu Opzioni > Video di IKEMEN: e' la
; stessa chiave.

[Config]
; niente schermata di benvenuto: sulla console non c'e' una tastiera da configurare
FirstRun          = 0

[Video]
; OpenGL ES 3.2 (predefinito) | OpenGL 3.3. Vulkan 1.3 non va su questa GPU
; (PanVK espone Vulkan 1.0: schermo nero) e rf35h-ikemen lo spegne.
RenderMode        = OpenGL ES 3.2
; risoluzione del pannello: si disegna a 1:1, niente scalatura
GameWidth         = 640
GameHeight        = 480
WindowWidth       = 640
WindowHeight      = 480
Fullscreen        = 1
VSync             = 1
; l'MSAA su una Mali-G31 MP2 a 640x480 costa piu' di quanto rende
MSAA              = 0
; niente geometry shader ne' shaderOutputLayer su questa GPU: rf35h-ikemen la
; rimette comunque a 0 a ogni avvio
EnableModelShadow = 0
