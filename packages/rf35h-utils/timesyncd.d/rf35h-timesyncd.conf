# devaOS RF35H: la unit di timesyncd in LibreELEC ha
#   ConditionPathExists=/dev/.kernel_ipconfig
# che vale per chi configura la rete dal kernel (netboot). Sul device quel file
# non c'e', quindi timesyncd veniva saltato a ogni avvio. Una ConditionX vuota
# azzera l'elenco: da qui in poi la unit parte normalmente.
#
# NIENTE After=network-online.target qui. timesyncd e' un servizio di early
# boot (DefaultDependencies=no, Before=sysinit.target): ordinarlo dopo la rete,
# che viene dopo sysinit, crea un ciclo che systemd spezza cancellando un job a
# sua scelta - sul device ha tolto la rete, e il Wi-Fi non trovava piu' nulla.
# timesyncd aspetta la rete da solo: riprova quando l'interfaccia sale.
[Unit]
ConditionPathExists=
