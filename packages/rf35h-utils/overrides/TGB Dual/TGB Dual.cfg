# devaOS RF35H - override di default per TGB Dual (Game Boy / Game Boy Color, 160x144 -> 3x = 480x432).
# Lo schermo e' 640x480, cioe' 4:3: le console casalinghe in 4:3 lo riempiono
# gia' esattamente e non hanno bisogno di nulla. Le portatili hanno proporzioni
# diverse, e senza scala intera RetroArch le stira a un fattore non intero,
# con pixel di dimensioni irregolari. La scala intera usa il massimo multiplo
# che entra nello schermo: pixel tutti uguali, bordi neri attorno.
#
# Copiato in /storage solo se non esiste gia': le tue modifiche non vengono
# mai sovrascritte. Per tornare al default, cancella questo file.
video_scale_integer = "true"
