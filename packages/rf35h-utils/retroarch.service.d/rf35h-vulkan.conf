# devaOS RF35H: Vulkan selezionabile come driver video di RetroArch, accanto a
# "gl" (OpenGL ES 3.x su Panfrost), che resta il predefinito.
[Service]
# PanVK su Bifrost (Mali-G31) si attiva solo con questa variabile: senza, il
# loader Vulkan non vede nessuna GPU e il driver "vulkan" di RetroArch non
# parte. Con "gl" non cambia nulla.
Environment=PAN_I_WANT_A_BROKEN_VULKAN_DRIVER=1
# Se con video_driver = "vulkan" RetroArch muore due volte di fila entro 30 s
# dall'avvio, rf35h-ra-guard rimette "gl": niente riavvio in ciclo a schermo nero.
ExecStartPre=-/usr/bin/rf35h-ra-guard pre
ExecStopPost=-/usr/bin/rf35h-ra-guard post
