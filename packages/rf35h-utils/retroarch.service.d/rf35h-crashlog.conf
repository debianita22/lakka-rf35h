# devaOS RF35H: retroarch.service ha Restart=always e nessun OnFailure, quindi
# un crash all'avvio e' un loop infinito e muto: sway con la barra, niente
# RetroArch, niente da leggere perche' il journal di Lakka e' su tmpfs. Da qui
# ogni fallimento scrive /storage/rf35h-logs/crash-<data>.txt.
[Unit]
OnFailure=rf35h-crashlog.service

[Service]
# Niente core dump. Lakka compila systemd senza coredump e sulla console non c'e'
# gdb: il core non serviva a nessuno. Intanto costava: RetroArch arriva a ~450 MB,
# il core finiva fuori da /storage (mai trovato) e ritardava di ~6 s lo
# spegnimento dopo un crash. Cio' che serve per la diagnosi lo raccoglie gia'
# rf35h-crashlog (OnFailure qui sopra).
LimitCORE=0
