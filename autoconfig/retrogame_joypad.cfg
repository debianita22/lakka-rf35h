# XiFan RF35H built-in gamepad (rocknix-singleadc-joypad).
#
# Indici verificati, non dedotti. input/drivers_joypad/udev_joypad.c di
# RetroArch assegna cosi':
#
#   for (i = KEY_UP;    i <= KEY_DOWN; i++)  if (bit) button_bind[i] = n++;
#   for (i = BTN_MISC;  i <  KEY_MAX;  i++)  if (bit) button_bind[i] = n++;
#
# Il primo ciclo copre KEY_UP..KEY_DOWN (103..108): questo pad non dichiara
# nessun KEY_* in quel range - i 17 pulsanti del device tree sono tutti BTN_* -
# quindi non sposta niente e la numerazione parte dal secondo ciclo, in ordine
# di codice evdev crescente:
#
#   BTN_SOUTH 0x130 -> 0   BTN_TL2  0x138 ->  6   BTN_THUMBR     0x13e -> 12
#   BTN_EAST  0x131 -> 1   BTN_TR2  0x139 ->  7   BTN_DPAD_UP    0x220 -> 13
#   BTN_NORTH 0x133 -> 2   BTN_SELECT 0x13a -> 8  BTN_DPAD_DOWN  0x221 -> 14
#   BTN_WEST  0x134 -> 3   BTN_START  0x13b -> 9  BTN_DPAD_LEFT  0x222 -> 15
#   BTN_TL    0x136 -> 4   BTN_MODE   0x13c -> 10 BTN_DPAD_RIGHT 0x223 -> 16
#   BTN_TR    0x137 -> 5   BTN_THUMBL 0x13d -> 11
#
# Il device tree etichetta "BTN-A" come BTN_EAST e "BTN-B" come BTN_SOUTH,
# quindi A=1 e B=0. Il dmesg del device conferma il conteggio:
# "joypad_dt_parse : adc key cnt = 4, gpio key cnt = 17".
#
# La croce direzionale sono pulsanti, non un hat: il driver la registra con
# input_set_capability(EV_KEY, BTN_DPAD_*). Un mapping "h0up" qui non
# funziona - vale per SDL2, che l'hat se lo sintetizza, non per udev.

input_driver = "udev"
input_device = "retrogame_joypad"
input_device_display_name = "XiFan RF35H Gamepad"
input_vendor_id = "18507"
input_product_id = "4353"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_b_btn_label = "B"
input_a_btn_label = "A"
input_x_btn_label = "X"
input_y_btn_label = "Y"

input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"

input_select_btn = "8"
input_start_btn = "9"
input_select_btn_label = "Select"
input_start_btn_label = "Start"

# ATTENZIONE a BTN_MODE (indice 10). Il device tree lo dichiara ma il commento
# che gli sta sopra dice cosa e':
#
#   this sw11 entry is SPECIAL, most [...] devices do not have this physical
#   button but for the sake of keeping compatibility with ES and retroarch,
#   this phantom button and offset will allow existing userspace programs to
#   work without doing any new remapping
#
# E' un pulsante fantasma: esiste solo per tenere allineata la numerazione con
# gli altri device. Se sull'RF35H non c'e' fisicamente, qualunque cosa ci
# venga legata e' irraggiungibile - per questo il menu qui NON e' legato a
# BTN_MODE ma a Select+Start, vedi in fondo.

input_l3_btn = "11"
input_r3_btn = "12"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"

input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"
input_up_btn_label = "Dpad Up"
input_down_btn_label = "Dpad Down"
input_left_btn_label = "Dpad Left"
input_right_btn_label = "Dpad Right"

# amux-count = 4 -> due stick. Il driver riporta ABS_X, ABS_Y, ABS_RX, ABS_RY
# (niente ABS_Z/ABS_RZ: i trigger sono pulsanti). udev_joypad.c fa
# "pad->axes_bind[i] = axes++" scorrendo i bit ABS, cioe' binding denso:
# 0, 1, 2, 3 - lo stick destro e' 2 e 3, non 3 e 4. Lega solo gli assi con
# maximum > minimum; qui il dmesg dice "ABS min = -1800, max = 1800".
# invert-absx / invert-absy li applica gia' il driver: qui i segni sono normali.
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_l_x_plus_axis_label = "LS Right"
input_l_x_minus_axis_label = "LS Left"
input_l_y_plus_axis_label = "LS Down"
input_l_y_minus_axis_label = "LS Up"

input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
input_r_x_plus_axis_label = "RS Right"
input_r_x_minus_axis_label = "RS Left"
input_r_y_plus_axis_label = "RS Down"
input_r_y_minus_axis_label = "RS Up"

# --- livello hotkey ----------------------------------------------------------
#
# Senza questo, su un handheld il menu di RetroArch non si apre e da un gioco
# non si esce: il toggle di default e' F1 su tastiera. I device simili in
# Lakka lo definiscono tutti - GameForceChi, GO-Advance, RG351MP - e questo
# segue lo stesso schema.
#
# La hotkey e' Select (indice 8), non BTN_MODE: quello e' il pulsante fantasma
# di cui sopra, e legarci il menu vorrebbe dire non poterlo aprire.
#
# Il prezzo e' minore di quanto sembri. RetroArch non toglie subito il tasto
# al gioco: input_driver.c incrementa un contatore mentre la hotkey e'
# premuta e blocca l'input al core solo dopo input_hotkey_block_delay poll,
# che di default sono 5 frame (~83 ms a 60 fps). Una pressione breve di
# Select - l'uso normale dentro un gioco - arriva al core lo stesso. Blocca
# solo se lo tieni premuto.
#
# La luminosita' e' L1+volume (non Select, che e' questa hotkey): la gestisce
# spkeys-service leggendo adc-keys e il joypad, RetroArch non c'entra.
#
# Sull'RF35H un pulsante F fisico non c'e': oltre a D-pad, ABXY, L1/L2/R1/R2,
# Select, Start e i due click degli stick ci sono solo power e reset, e nessuno
# dei due e' utilizzabile. Il power e' il tasto del PMIC (rk805 pwrkey, un
# input device a parte) e lo gestisce logind; il reset non compare affatto nel
# device tree, e' una linea hardware verso il PMIC. Quindi BTN_MODE resta
# quello che il commento dice: un fantasma.

input_enable_hotkey_btn = "8"
input_enable_hotkey_btn_label = "Select"

# Il toggle via hotkey in RetroArch 1.22 scatta al RILASCIO di Start (con Select
# tenuto): "Set menu toggle on release" in input_driver.c. Per questo la combo
# nativa Select+Start, che Lakka accende per l'RK3326 e scatta alla pressione,
# e' spenta per l'RF35H (integration/retroarch-no-go2-rf35h.patch): con
# entrambe il menu si apriva premendo e si richiudeva lasciando.
input_menu_toggle_btn = "9"
input_menu_toggle_btn_label = "Select + Start"
input_exit_emulator_btn = "12"

input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "16"
input_state_slot_decrease_btn = "15"

input_hold_fast_forward_btn = "7"
input_rewind_btn = "6"
input_screenshot_btn = "2"
