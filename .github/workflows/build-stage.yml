# Una parte della build: un job, al massimo 6 ore sui runner gratuiti. La
# chiama build.yml fino a otto volte di fila. Ogni parte riprende lo stato
# della precedente, costruisce fino a BUILD_MINUTES dall'inizio del job e, se
# non ha finito, salva lo stato per la successiva (tools/ci-build.sh).
name: Build stage

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      last:
        description: "l'ultima parte: se non finisce, la build fallisce"
        type: boolean
        default: false
      version:
        type: string
        required: true
      resume_run:
        description: "solo parte 1: riprende dallo stato salvato da un run fallito"
        type: string
        default: ""
    outputs:
      result:
        description: "done: immagine fatta; continue: serve un'altra parte"
        value: ${{ jobs.build.outputs.result }}

permissions:
  contents: read
  actions: read     # artifact di un altro run (resume_run)

jobs:
  build:
    name: Parte ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    outputs:
      result: ${{ steps.build.outputs.result }}
    env:
      RF35H_VERSION: ${{ inputs.version }}
      RF35H_UPDATE_REPO: ${{ github.repository }}
      RF35H_CONTAINER: rf35h-build
      # i sorgenti dei pacchetti finiti si cancellano: lo spazio del runner
      # non basta per tenerli tutti
      AUTOREMOVE: "yes"
      # una toolchain ricostruita da zero ha un'altra data: per ccache conta
      # il contenuto del compilatore, non la data
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      # minuti dall'inizio del job in cui la build deve fermarsi: il resto
      # (stato, upload) deve stare nelle 6 ore
      BUILD_MINUTES: 320
    steps:
      - name: Inizio
        run: |
          echo "JOB_START=$(date +%s)" >> "${GITHUB_ENV}"
          echo "PREV=$(( ${{ inputs.stage }} - 1 ))" >> "${GITHUB_ENV}"
          echo "### Parte ${{ inputs.stage }} (${RF35H_VERSION})" >> "${GITHUB_STEP_SUMMARY}"
          nproc; free -g

      - uses: actions/checkout@v7

      # Di solito due minuti. Il limite: il 7/10/2026 una parte e' rimasta
      # qui tre ore (apt o la pulizia), e senza sarebbe arrivata alle sei
      # del job. tools/ci-apt.sh: tre tentativi, ognuno con il suo timeout.
      - name: Spazio su disco
        timeout-minutes: 20
        run: |
          ./tools/ci-apt.sh zstd squashfs-tools
          ./tools/ci-build.sh disk

      - name: Stato della parte precedente
        if: inputs.stage > 1
        uses: actions/download-artifact@v8
        with:
          name: state-${{ env.PREV }}.tar.zst
          path: ${{ env.W }}/dl

      - name: Estrai lo stato
        if: inputs.stage > 1
        run: ./tools/ci-build.sh unpack "${PREV}"

      # Ripresa di un run fallito (solo build di prova: lo controlla build.yml).
      # Lo stato piu' avanzato che quel run ha salvato, uno solo (ognuno pesa
      # GB), poi l'albero riportato a Lakka pulito tenendo i pacchetti fatti:
      # "prepare" riapplica l'overlay di questo commit e la build rifa' solo i
      # pacchetti i cui file sono cambiati. Quello che si fa a mano dopo
      # "overlay disallineato". La ccache e' nello stato.
      - name: Run da riprendere
        id: resume
        if: inputs.stage == 1 && inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.resume_run }}
        run: |
          name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name | select(test("^state-[0-9]+[.]tar[.]zst$"))]
                  | sort_by(ltrimstr("state-") | rtrimstr(".tar.zst") | tonumber) | last // empty')"
          if [ -z "${name}" ]; then
            echo "::error::il run ${RUN} non ha uno stato da riprendere: scaduto, o fallito prima della build"
            exit 1
          fi
          n="${name#state-}"
          { echo "name=${name}"; echo "n=${n%.tar.zst}"; } >> "${GITHUB_OUTPUT}"
          echo "- ripresa dal run ${RUN} (${name}): pacchetti di due commit, solo per prova" >> "${GITHUB_STEP_SUMMARY}"

      - name: Stato del run da riprendere
        if: steps.resume.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.resume.outputs.name }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: ${{ env.W }}/dl

      - name: Albero del run da riprendere
        if: steps.resume.outcome == 'success'
        env:
          N: ${{ steps.resume.outputs.n }}
        run: |
          ./tools/ci-build.sh unpack "${N}"
          ./tools/ci-build.sh reset

      - name: Albero Lakka, overlay e verifiche
        run: ./tools/ci-build.sh prepare

      # ccache della build precedente (la parte 1; le altre lo ricevono nello stato)
      - name: ccache
        if: inputs.stage == 1 && inputs.resume_run == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.W }}/lakka-rf35h-build/build.*/.ccache
            ${{ env.W }}/lakka-rf35h-build/build.*/.ccache-local
          key: ccache-rf35h-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          restore-keys: ccache-rf35h-

      - name: Build
        id: build
        run: ./tools/ci-build.sh build

      - name: ccache, statistiche
        if: always() && steps.build.outcome != 'skipped'
        run: ./tools/ci-build.sh ccache-stats

      - name: Log
        if: always() && steps.build.outcome != 'skipped'
        run: ./tools/ci-build.sh logs "${{ inputs.stage }}"

      - uses: actions/upload-artifact@v7
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: ${{ env.W }}/log-${{ inputs.stage }}.tar.zst
          archive: false
          retention-days: 14
          if-no-files-found: ignore

      # --- fallita: lo stato, per riprenderla (Run workflow, resume_run) --------
      - name: Stato della build fallita
        if: failure() && steps.build.outcome == 'failure'
        run: ./tools/ci-build.sh pack "${{ inputs.stage }}" failed

      - uses: actions/upload-artifact@v7
        if: failure() && steps.build.outcome == 'failure'
        with:
          path: ${{ env.W }}/state-${{ inputs.stage }}.tar.zst
          archive: false
          retention-days: 3
          compression-level: 0

      # --- non finita: lo stato per la parte successiva -------------------------
      - name: Non finita nell'ultima parte
        if: steps.build.outputs.result == 'continue' && inputs.last
        run: |
          echo "::error::la build non e' finita nemmeno nell'ultima parte"
          exit 1

      - name: Stato per la parte successiva
        if: steps.build.outputs.result == 'continue' && !inputs.last
        run: ./tools/ci-build.sh pack "${{ inputs.stage }}"

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.result == 'continue' && !inputs.last
        with:
          path: ${{ env.W }}/state-${{ inputs.stage }}.tar.zst
          archive: false
          retention-days: 2
          compression-level: 0

      # --- finita: i file della release e la ccache -----------------------------
      - name: File della release
        if: steps.build.outputs.result == 'done'
        run: ./tools/ci-build.sh collect

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.result == 'done'
        with:
          name: lakka-rf35h-${{ inputs.version }}
          path: ${{ env.W }}/dist/
          retention-days: 14
          compression-level: 0

      # La ccache alla fine di ogni parte, anche fallita: una build nuova (o
      # una ripresa dopo un errore) riparte dall'ultima, non da zero. Le
      # chiavi sono uniche (le cache non si sovrascrivono); quando si supera
      # il limite di 10 GB del repository GitHub toglie le piu' vecchie.
      - uses: actions/cache/save@v6
        if: always() && steps.build.outcome != 'skipped'
        with:
          path: |
            ${{ env.W }}/lakka-rf35h-build/build.*/.ccache
            ${{ env.W }}/lakka-rf35h-build/build.*/.ccache-local
          key: ccache-rf35h-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
