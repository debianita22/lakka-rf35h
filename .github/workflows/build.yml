# La build dell'immagine e la release.
#
#   tag v*                   build e release con quel nome (git tag v1.0.0;
#                            git push origin v1.0.0)
#   Run workflow (a mano)    con "version" vuota: build di prova, niente
#                            release, l'immagine resta negli artifact del run;
#                            con "version": build e release, tag creato qui
#   push su ci-test/**       build di prova, mai una release
#   Run workflow, resume_run l'ID di un run fallito: build di prova che
#                            riparte dal suo stato (salvato per 3 giorni) e
#                            rifa' solo i pacchetti cambiati. Pacchetti di
#                            due commit insieme: mai per una release.
#
# La build sta in fino a otto parti di 6 ore (build-stage.yml): con tutti i
# 162 core da zero ne servono piu' di quattro. La release
# ha l'immagine (.img.gz, prima installazione), l'aggiornamento (.tar, quello
# che scaricano le console da Device Settings > Aggiornamento di sistema),
# update.txt (cosa scaricare: le console leggono quello della release
# "latest") e SHA256SUMS. Mai re3 (GTA III): non ha licenza, e la build qui
# non lo ha.
#
# Quale release arriva alle console (tools/ci-build.sh version e publish):
#   - pre-release: con la casella "prerelease" o con un trattino nella
#     versione (v1.1.0-rc1), da un tag come da Run workflow. Mai "latest":
#     le console non la vedono. Da qualunque ramo.
#   - le altre solo dal ramo principale: Run workflow da li', o un tag su un
#     suo commit. Diventano "latest" solo se la versione e' piu' alta di
#     quella "latest" di adesso (sort -V): una v1.0.1 dopo la v1.1.0, o il job
#     Release di una versione vecchia rilanciato, non fa tornare indietro le
#     console.
#   - una pre-release provata diventa "latest" senza ricostruirla (cosi' la
#     v1.1.0: Run workflow con version v1.1.0 e prerelease, prove, poi):
#       gh release edit v1.1.0 --repo debianita22/lakka-rf35h --prerelease=false --latest
#     Senza --latest GitHub sceglie da solo, per data e versione.
#   - niente release se all'immagine manca un core di CORES_DEFAULT o un
#     gioco: --keep-going lascia fuori cio' che non compila (basta un errore
#     di rete) e le console che aggiornano lo perderebbero. Run workflow con
#     allow_incomplete la pubblica lo stesso.
#   - il job Release si puo' rilanciare: la bozza di un tentativo fallito si
#     cancella e si rifa'. Un tag che c'e' gia' deve essere sul commit della
#     build, e due run della stessa versione (tag e Run workflow) non girano
#     insieme (concurrency per versione).
name: Build
# Il titolo del run dice cosa costruisce: gli input di "Run workflow" non si
# vedono dall'API ne' dall'elenco dei run, e la versione e' quello che conta.
run-name: >-
  ${{ github.ref_type == 'tag' && format('Release {0}{1}', github.ref_name, contains(github.ref_name, '-') && ' (pre-release)' || '')
  || inputs.version != '' && format('Release {0}{1}', inputs.version, (inputs.prerelease || contains(inputs.version, '-')) && ' (pre-release)' || '')
  || inputs.resume_run != '' && format('Build di prova, ripresa da {0}', inputs.resume_run)
  || format('Build di prova ({0})', github.ref_name) }}

on:
  push:
    tags: ['v*']
    branches: ['ci-test/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare (es. v1.0.0). Vuota: build di prova, niente release"
        type: string
        default: ""
      prerelease:
        description: "Pre-release: gli aggiornamenti delle console non la vedono"
        type: boolean
        default: false
      resume_run:
        description: "Solo build di prova: ID di un run fallito da cui riprendere (ricostruisce solo cio' che e' cambiato)"
        type: string
        default: ""
      allow_incomplete:
        description: "Pubblica anche se mancano core o giochi (non compilati): le console che aggiornano li perdono"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Una release per versione alla volta: il push del tag v1.1.0 e un Run
# workflow con version v1.1.0 stanno nello stesso gruppo (partono da ref
# diversi). Le build di prova restano una per ref.
concurrency:
  group: build-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Versione e controlli
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      resume: ${{ steps.v.outputs.resume }}
    steps:
      # la storia intera: un tag di una release non pre-release deve stare
      # sul ramo principale (git merge-base --is-ancestor)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # versione, release o prova, pre-release (un trattino: sempre), ramo
      # principale, tag e release che esistono gia': tools/ci-build.sh version
      - name: Versione
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_RESUME: ${{ inputs.resume_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./tools/ci-build.sh version

      # gli stessi controlli di check.yml: un errore qui costa un minuto,
      # dopo ore di build costerebbe la build
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck busybox squashfs-tools >/dev/null
          pip install -q --break-system-packages actionlint-py
      - name: tools/ci-check.sh
        run: ./tools/ci-check.sh

  stage1:
    needs: setup
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      version: ${{ needs.setup.outputs.version }}
      resume_run: ${{ needs.setup.outputs.resume }}

  stage2:
    needs: [setup, stage1]
    if: needs.stage1.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
      version: ${{ needs.setup.outputs.version }}

  stage3:
    needs: [setup, stage2]
    if: needs.stage2.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
      version: ${{ needs.setup.outputs.version }}

  stage4:
    needs: [setup, stage3]
    if: needs.stage3.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
      version: ${{ needs.setup.outputs.version }}

  stage5:
    needs: [setup, stage4]
    if: needs.stage4.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5
      version: ${{ needs.setup.outputs.version }}

  stage6:
    needs: [setup, stage5]
    if: needs.stage5.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 6
      version: ${{ needs.setup.outputs.version }}

  stage7:
    needs: [setup, stage6]
    if: needs.stage6.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 7
      version: ${{ needs.setup.outputs.version }}

  stage8:
    needs: [setup, stage7]
    if: needs.stage7.outputs.result == 'continue'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 8
      last: true
      version: ${{ needs.setup.outputs.version }}

  release:
    name: Release
    needs: [setup, stage1, stage2, stage3, stage4, stage5, stage6, stage7, stage8]
    if: >-
      !cancelled() && needs.setup.outputs.publish == 'true' &&
      (needs.stage1.outputs.result == 'done' || needs.stage2.outputs.result == 'done' ||
       needs.stage3.outputs.result == 'done' || needs.stage4.outputs.result == 'done' ||
       needs.stage5.outputs.result == 'done' || needs.stage6.outputs.result == 'done' ||
       needs.stage7.outputs.result == 'done' || needs.stage8.outputs.result == 'done')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.setup.outputs.version }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      RF35H_ALLOW_INCOMPLETE: ${{ inputs.allow_incomplete }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # la storia intera e i tag: le note elencano i commit dall'ultima
      # release, e publish riguarda che il commit sia sul ramo principale
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: lakka-rf35h-${{ needs.setup.outputs.version }}
          path: dist

      - name: Controlli
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          grep -qx "version=${VERSION}" update.txt
          tar="$(sed -n 's/^tar=//p' update.txt)"
          [ -f "${tar}" ] && [ "$(sha256sum "${tar}" | cut -d' ' -f1)" = "$(sed -n 's/^sha256=//p' update.txt)" ]
          [ "$(stat -c%s "${tar}")" = "$(sed -n 's/^size=//p' update.txt)" ]
          ls -la

      # Di nuovo sui file scaricati, quelli che si pubblicano: re3 e core rotti
      # nel SYSTEM, poi i core di CORES_DEFAULT e i giochi. Un'immagine a cui
      # manca qualcosa (--keep-going) toglierebbe quel core a ogni console che
      # aggiorna: si ferma qui, a meno di allow_incomplete.
      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools >/dev/null
      - name: re3, core rotti, core e giochi mancanti
        run: ./tools/ci-build.sh check-dist dist

      - name: Note della release
        run: ./tools/ci-release-notes.sh dist > dist/RELEASE-NOTES.md

      # Bozza, file, poi pubblicata (una console che guarda proprio in quel
      # momento non trova mai una release senza update.txt). Prima: commit sul
      # ramo principale (se non e' pre-release), tag gia' esistente solo su
      # questo commit, via le bozze di un tentativo fallito; "latest" solo se
      # la versione e' la piu' alta. tools/ci-build.sh publish
      - name: Pubblica
        run: ./tools/ci-build.sh publish dist
